name: Keepalive

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  enable:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in health.yml keepalive.yml; do
            curl -fsS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
