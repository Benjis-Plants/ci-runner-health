name: Keepalive

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  enable:
    runs-on: ubuntu-latest
    environment: failover
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Re-enable workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in health.yml keepalive.yml; do
            curl -fsS -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done
      - name: Alert on failure
        if: failure()
        env:
          SLACK_FAILOVER_WEBHOOK: ${{ secrets.SLACK_FAILOVER_WEBHOOK }}
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"text":"ci-runner-health keepalive failed (route: keepalive). See workflow run."}' \
            "$SLACK_FAILOVER_WEBHOOK"
      - name: Capture failure to Sentry
        if: failure()
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/keepalive-capture.mjs
